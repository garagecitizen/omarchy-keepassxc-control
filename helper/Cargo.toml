[package]
name = "keepassxc-control-helper"
version = "0.1.0"
edition = "2021"
description = "Resident KeePassXC helper for the Omarchy bar plugin"

[[bin]]
name = "keepassxc-control-helper"
path = "src/main.rs"

[[bin]]
name = "create-synthetic-db"
path = "src/bin/create_synthetic_db.rs"
required-features = ["generate-fixture"]

[features]
generate-fixture = ["keepass/save_kdbx4"]

[dependencies]
keepass = "0.13"
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
keepass = { version = "0.13", features = ["save_kdbx4"] }

[profile.release]
lto = true
codegen-units = 1
